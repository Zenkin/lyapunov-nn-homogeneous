name: Implementation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements.txt'
      - name: Install pinned CPU dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all implementation tests
        run: python -m unittest discover -v
      - name: Regenerate publication tables from committed records
        run: python publication/make_summary.py
      - name: Check that published tables match their source records
        run: git diff --exit-code -- publication/reference
