name: Implementation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements.txt'
      - name: Install pinned CPU dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all implementation tests
        run: python -m unittest discover -v
      - name: Reproduce the preserved checkpoints and verify numerical results
        run: python reproduction/reproduce.py --outdir results/checkpoint-reproduction
      - name: Smoke test Example 1 / original
        run: python -m example_1.original.example1 --quick --outdir example_1/original/results/quick
      - name: Smoke test Example 1 / improved
        run: python -m example_1.improved.example1 --quick --outdir example_1/improved/results/quick
      - name: Smoke test Example 2 / article version
        run: python -m example_2.article_version.example2 --quick --outdir example_2/article_version/results/quick
      - name: Smoke test Example 2 / corrected matrix
        run: python -m example_2.corrected_matrix.example2 --quick --outdir example_2/corrected_matrix/results/quick
      - name: Smoke test Example 2 / improved
        run: python -m example_2.improved.example2 --quick --outdir example_2/improved/results/quick
      - name: Regenerate publication tables from committed records
        run: python publication/make_summary.py
      - name: Check that published tables match their source records
        run: git diff --exit-code -- publication/reference
